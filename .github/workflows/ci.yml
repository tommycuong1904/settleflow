name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  verify:
    name: Verify supported test stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: settleflow_test
          POSTGRES_USER: settleflow_test
          POSTGRES_PASSWORD: settleflow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settleflow_test -d settleflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      CI: "true"
      DATABASE_URL: postgresql://settleflow_test:settleflow_test_password@localhost:5432/settleflow_test
      SETTLEFLOW_TEST_DATABASE_URL: postgresql://settleflow_test:settleflow_test_password@localhost:5432/settleflow_test
      NEXT_PUBLIC_ARC_EXECUTION_MODE: mock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma migrations to isolated test database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Database integration tests
        run: npm run test:integration:db

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
          SETTLEFLOW_AUTH_SECRET: ci-build-only-auth-secret-not-for-deployment
